<h1 id="h1">Agla video kya banana hai?</h1>
<p class="lede">Apni niche batao. Ek behtareen video idea aur script lo jo aaj hi record kar sako. <span id="trial-counter" style="color: #4ade80; display: block; margin-top: 4px; font-weight: bold;">Muft trials bache hain: 3/3</span></p>
<form id="brief" novalidate>
  <fieldset class="field">
    <legend class="label">Kahan post karoge?</legend>
    <div class="opts">
      <label class="opt"><input type="radio" name="fmt" value="yt" checked><span class="box"><b>YouTube video</b><small>5 se 10 minute</small></span></label>
      <label class="opt"><input type="radio" name="fmt" value="short"><span class="box"><b>YouTube Short</b><small>60 second se kam</small></span></label>
      <label class="opt"><input type="radio" name="fmt" value="reel"><span class="box"><b>Instagram Reel</b><small>20 se 45 second</small></span></label>
    </div>
  </fieldset>
  <div class="field">
    <label class="label" for="niche">Tumhari niche</label>
    <input id="niche" name="niche" type="text" maxlength="120" autocomplete="off" placeholder="Busy parents ke liye ghar par workout" aria-describedby="niche-error">
    <p class="field-error" id="niche-error" role="alert" hidden></p>
  </div>
  <div class="field">
    <label class="label" for="audience">Tumhare viewers <span class="hint">(optional)</span></label>
    <input id="audience" name="audience" type="text" maxlength="120" autocomplete="off" placeholder="Beginners jinke paas roz 20 minute hain">
  </div>
  <fieldset class="field">
    <legend class="label">Tone</legend>
    <div class="chips">
      <label class="chip"><input type="radio" name="tone" value="Educational" checked><span class="box">Sikhane wala</span></label>
      <label class="chip"><input type="radio" name="tone" value="Funny"><span class="box">Funny</span></label>
      <label class="chip"><input type="radio" name="tone" value="Inspiring"><span class="box">Inspiring</span></label>
      <label class="chip"><input type="radio" name="tone" value="Straight-talking"><span class="box">Seedha-seedha</span></label>
    </div>
  </fieldset>
  <button class="btn primary" id="go" type="submit">Idea lo</button>
</form>
